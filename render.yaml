databases:
  - name: breathewise-db
    databaseName: breathewise
    user: breathewise_user
    region: oregon
    plan: free

services:
  - type: web
    name: breathewise-ai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://breathewise-ai.vercel.app,http://localhost:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: breathewise-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
    healthCheckPath: /health
